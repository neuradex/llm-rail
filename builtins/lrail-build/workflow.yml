name: lrail-build
version: "0.2.0"
description: "Generate a working lrail workflow — design, generate YAML, and verify by test run."
phase: draft
params:
  requirements:
    type: string
    required: true
    description: "Finalized requirements (post-analysis, confirmed by user)"
  output_name:
    type: string
    required: false
    default: "generated"
    description: "Name for the generated workflow"
policy:
  mode: trail
steps:
  - id: design
    description: Analyze requirements and design workflow steps
    instruction: |
      Read the lrail design process and principles:
      - `lrail docs workflow/design-process`
      - `lrail docs workflow/design-tips`
      - `lrail docs concepts/step-types`
      - `lrail docs concepts/validation`

      Requirements: {{requirements}}
      Output workflow name: {{output_name}}

      Follow Phase 1-2 of the design process: understand the task, then propose a step breakdown with ids, types (programmatic/agentic), required_output, and data flow.
    required_output:
      - step_plan
      - total_steps
      - programmatic_count
      - agentic_count
    validation:
      - field: step_plan
        op: type
        value: array
      - field: step_plan
        op: not_empty
      - field: step_plan
        op: each_has
        value: id
      - field: step_plan
        op: each_has
        value: type
      - field: total_steps
        op: type
        value: number
      - field: total_steps
        op: min
        value: 1
    tips:
      - Prefer programmatic steps where possible (lower cost, deterministic)
      - Each step should have a single clear responsibility
      - Use context_in to pass data between steps explicitly

  - id: generate-yaml
    description: Generate workflow YAML from the design
    instruction: |
      Read Phase 3 of the design process:
      - `lrail docs workflow/design-process`

      Convert the step plan into a valid lrail workflow YAML for '{{output_name}}'.
      Requirements: {{requirements}}

      Save to `workflows/{{output_name}}/workflow.yml`, then validate with `lrail wf {{output_name}} validate`.
      Fix any validation errors before submitting.
    context_in:
      step_plan: "{design.step_plan}"
    required_output:
      - workflow_yaml
      - validation_passed
    validation:
      - field: workflow_yaml
        op: type
        value: string
      - field: workflow_yaml
        op: not_empty
      - field: validation_passed
        op: eq
        value: true
        message: "Workflow must pass lrail validation before proceeding"
    tips:
      - "instruction is the agent directive (required for agentic). description is optional human label."
      - "Test with `lrail wf <name> validate` — fix all errors before submitting"

  - id: test-run
    description: Execute the generated workflow end-to-end
    instruction: |
      Read Phase 5 of the design process:
      - `lrail docs workflow/design-process`

      Run '{{output_name}}' end-to-end:
      1. `lrail wf {{output_name}} create`
      2. `lrail <id> start`
      3. For each agentic step, perform the task and submit with `lrail <id> next --result '<json>'`
      4. Programmatic steps auto-execute

      Record rejection count and whether all steps completed.

      If you modify the workflow YAML during the test run, record each change as a modification object
      in the `modifications` output array with: field, before, after, reason, and type.
      Type must be one of:
      - "bug_fix" — syntax errors, EPIPE, wrong field names, broken scripts
      - "requirement_change" — altering thresholds, criteria, or scope from the original requirements

      Bug fixes are expected. Requirement changes should be a last resort —
      exhaust other approaches first (better data sources, retry logic, etc.).
    context_in:
      workflow_yaml: "{generate-yaml.workflow_yaml}"
    required_output:
      - completed
      - total_rejections
      - step_results
      - modifications
    validation:
      - field: completed
        op: type
        value: boolean
      - field: completed
        op: eq
        value: true
        message: "Workflow must complete successfully"
      - field: total_rejections
        op: type
        value: number
      - field: step_results
        op: type
        value: array
      - field: modifications
        op: type
        value: array
    tips:
      - If a step fails, analyze why and retry with corrected output
      - Bug fixes (syntax, runtime errors) are fine — just record them
      - Requirement changes (thresholds, criteria) are a last resort — try harder before changing the spec
