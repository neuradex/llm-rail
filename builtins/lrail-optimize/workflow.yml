name: lrail-optimize
version: "0.4.0"
description: "Optimize an existing workflow across 4 metrics: programmatic ratio, execution time, validation failures, and minimum passing model tier."
phase: draft
params:
  workflow_name:
    type: string
    required: true
    description: Name of the workflow to optimize
  target_variant:
    type: string
    required: false
    description: "Variant to optimize (omit for base workflow)"
policy:
  mode: trail
steps:
  # Step 1: Snapshot original
  # Save the original workflow YAML so we can restore it if any step corrupts it.
  - id: snapshot-original
    description: Save original workflow YAML
    type: programmatic
    actions:
      - js: |
          const fs = require("fs");
          const name = context.workflow_name;
          const paths = [
            "workflows/" + name + "/workflow.yml",
            "builtins/" + name + "/workflow.yml"
          ];
          let content = null;
          let foundPath = null;
          for (const p of paths) {
            if (fs.existsSync(p)) { content = fs.readFileSync(p, "utf8"); foundPath = p; break; }
          }
          if (!content) { throw new Error("Workflow file not found"); }
          return { original_yaml: content, original_path: foundPath };
    required_output:
      - original_yaml
      - original_path

  # Step 2: Baseline measurement
  - id: baseline
    description: Measure baseline metrics
    depends_on: snapshot-original
    instruction: |
      Measure the current performance of workflow '{{workflow_name}}':

      1. Read the workflow YAML: `lrail wf {{workflow_name}} show`
      2. Count programmatic vs total steps → programmatic_ratio
      3. Create an instance and run to completion:
         `lrail wf {{workflow_name}} create`
      4. Record execution time (wall-clock seconds from start to completion)
      5. Record validation failure count (number of `next` rejections)
      6. Record which model tier you are running as (haiku=1, sonnet=2, opus=3)

      IMPORTANT: Do NOT modify any workflow files. Only read and execute.
    context_in:
      original_yaml: "{snapshot-original.original_yaml}"
    required_output:
      - workflow_yaml
      - total_steps
      - programmatic_steps
      - programmatic_ratio
      - execution_time_sec
      - validation_failure_count
      - min_passing_tier
    validation:
      - field: workflow_yaml
        op: type
        value: string
      - field: workflow_yaml
        op: not_empty
      - field: total_steps
        op: type
        value: number
      - field: total_steps
        op: min
        value: 1
      - field: programmatic_steps
        op: type
        value: number
      - field: programmatic_ratio
        op: type
        value: number
      - field: execution_time_sec
        op: type
        value: number
      - field: validation_failure_count
        op: type
        value: number
      - field: min_passing_tier
        op: type
        value: number
    tips:
      - programmatic_ratio = programmatic_steps / total_steps
      - For execution_time_sec, measure from `start` to final `next` command
      - validation_failure_count = number of times `next` was rejected
      - Use minimal params for the test run to keep it fast (e.g., min_companies=3)

  # Steps 3-5: Optimization
  # Each step:
  #   1. Receives previous YAML via context_in (NOT by reading the file)
  #   2. Saves changes as variant file: workflows/<name>/optimized.workflow.yml
  #   3. Validates/tests using --variant optimized
  #   4. Submits the optimized YAML content
  #   5. Assertion checks original file was NOT modified (rejects if tampered)
  #   6. Post-completion action restores the original file (safety net)

  - id: optimize-programmatic
    description: Improve programmatic ratio
    depends_on: baseline
    instruction: |
      Goal: Improve the programmatic step ratio of workflow '{{workflow_name}}'.
      Baseline: {baseline.programmatic_ratio} ({baseline.programmatic_steps}/{baseline.total_steps})

      ## 1. Analyze
      Review the workflow YAML (in context). For each agentic step, evaluate:
      - Can the output be computed deterministically? → programmatic
      - Can it use a structured API instead of free-form search? → programmatic with `shell:` or `js:` actions
      - Is it simple data transformation? → definitely programmatic

      ## 2. Save as variant (full YAML, not diff)
      Write the complete optimized workflow YAML and save it:
      ```
      lrail {{workflow_name}} bash 'lrail wf {{workflow_name}} save-variant optimized --yaml '"'"'<full-yaml>'"'"''
      ```
      Then validate:
      ```
      lrail {{workflow_name}} bash 'lrail wf {{workflow_name}} validate --variant optimized'
      ```

      ## 3. Execute the variant
      Create an instance from the variant and run it to completion:
      ```
      lrail {{workflow_name}} bash 'lrail wf {{workflow_name}} create --variant optimized'
      ```
      Run the created instance through all steps. Measure and count programmatic vs total steps from the YAML.

      ## 4. Submit
      Submit: optimized_yaml (the full YAML string), changes (array of what you changed and why), new_programmatic_ratio (number).

      Do NOT compromise correctness — only convert steps where the programmatic version produces equivalent results.
      NEVER modify the original workflow.yml — only save as variant.
    context_in:
      workflow_yaml: "{baseline.workflow_yaml}"
      original_yaml: "{snapshot-original.original_yaml}"
      original_path: "{snapshot-original.original_path}"
    required_output:
      - optimized_yaml
      - changes
      - new_programmatic_ratio
    validation:
      - field: optimized_yaml
        op: type
        value: string
      - field: optimized_yaml
        op: not_empty
      - field: changes
        op: type
        value: array
      - field: new_programmatic_ratio
        op: type
        value: number
    assertions:
      - field: new_programmatic_ratio
        op: min
        value: "{baseline.programmatic_ratio}"
        message: "Programmatic ratio must not decrease (baseline: {baseline.programmatic_ratio})"
      - field: optimized_yaml
        op: script
        value: |
          node -e '
          const fs = require("fs");
          const ctx = process.env.CONTEXT ? JSON.parse(process.env.CONTEXT) : JSON.parse(fs.readFileSync(process.env.CONTEXT_FILE, "utf8"));
          const current = fs.readFileSync(ctx.original_path, "utf8");
          if (current !== ctx.original_yaml) {
            process.stderr.write("VIOLATION: original workflow.yml was modified — use variant files only");
            process.exit(1);
          }
          '
        message: "Original workflow.yml must NOT be modified — use variant files only"
    actions:
      - js: |
          const fs = require("fs");
          fs.writeFileSync(context.original_path, context.original_yaml);
    tips:
      - Data filtering, sorting, and aggregation are good candidates for programmatic
      - Steps that require web search or subjective judgment should stay agentic
      - "Use js: actions for data transformation, shell: for external commands"
      - "Save via CLI: lrail wf {{workflow_name}} save-variant optimized --yaml '<content>' — NEVER modify workflow.yml directly"

  - id: optimize-time
    description: Reduce execution time
    depends_on: optimize-programmatic
    instruction: |
      Goal: Reduce the execution time of workflow '{{workflow_name}}'.
      Baseline: {baseline.execution_time_sec} seconds.
      Starting from the YAML optimized in the previous step (in context).

      ## 1. Analyze
      Strategies:
      - Merge sequential steps that don't need intermediate validation
      - Reduce dependencies to allow parallel execution
      - Simplify instructions to reduce agent processing time
      - Add tips that help agents complete faster (specific URLs, exact formats)
      - Split large agentic steps only if it enables parallelism

      ## 2. Save as variant (full YAML, not diff)
      ```
      lrail {{workflow_name}} bash 'lrail wf {{workflow_name}} save-variant optimized --yaml '"'"'<full-yaml>'"'"''
      lrail {{workflow_name}} bash 'lrail wf {{workflow_name}} validate --variant optimized'
      ```

      ## 3. Execute the variant and measure
      ```
      lrail {{workflow_name}} bash 'lrail wf {{workflow_name}} create --variant optimized'
      ```
      Run the created instance through all steps. Measure wall-clock execution time from start to completion.

      ## 4. Submit
      Submit: optimized_yaml (full YAML string), changes (array), execution_time_sec (measured number).

      NEVER modify the original workflow.yml — only save as variant.
    context_in:
      workflow_yaml: "{optimize-programmatic.optimized_yaml}"
      original_yaml: "{snapshot-original.original_yaml}"
      original_path: "{snapshot-original.original_path}"
    required_output:
      - optimized_yaml
      - changes
      - execution_time_sec
    validation:
      - field: optimized_yaml
        op: type
        value: string
      - field: optimized_yaml
        op: not_empty
      - field: changes
        op: type
        value: array
      - field: execution_time_sec
        op: type
        value: number
    assertions:
      - field: execution_time_sec
        op: max
        value: "{baseline.execution_time_sec}"
        message: "Execution time must not increase (baseline: {baseline.execution_time_sec}s)"
      - field: optimized_yaml
        op: script
        value: |
          node -e '
          const fs = require("fs");
          const ctx = process.env.CONTEXT ? JSON.parse(process.env.CONTEXT) : JSON.parse(fs.readFileSync(process.env.CONTEXT_FILE, "utf8"));
          const current = fs.readFileSync(ctx.original_path, "utf8");
          if (current !== ctx.original_yaml) {
            process.stderr.write("VIOLATION: original workflow.yml was modified — use variant files only");
            process.exit(1);
          }
          '
        message: "Original workflow.yml must NOT be modified — use variant files only"
    actions:
      - js: |
          const fs = require("fs");
          fs.writeFileSync(context.original_path, context.original_yaml);
    tips:
      - Parallel execution of independent steps is the biggest time win
      - Reducing the number of agentic steps also reduces time (each agentic step has LLM overhead)
      - Don't merge steps if the intermediate validation catches important errors
      - "Save via CLI: lrail wf {{workflow_name}} save-variant optimized --yaml '<content>' — NEVER modify workflow.yml directly"

  - id: optimize-validation
    description: Reduce validation failure count
    depends_on: optimize-time
    instruction: |
      Goal: Reduce validation failures in workflow '{{workflow_name}}'.
      Baseline: {baseline.validation_failure_count} failures.
      Starting from the YAML optimized in the previous step (in context).

      ## 1. Analyze
      Strategies:
      - Improve instructions — be more specific about expected output format
      - Add examples in tips showing exact JSON structure expected
      - Simplify overly strict validation rules that cause false rejections
      - Add format hints — specify exact field names, types, and constraints
      - Use context_in to provide prior step outputs so agents have the data they need

      ## 2. Save as variant (full YAML, not diff)
      ```
      lrail {{workflow_name}} bash 'lrail wf {{workflow_name}} save-variant optimized --yaml '"'"'<full-yaml>'"'"''
      lrail {{workflow_name}} bash 'lrail wf {{workflow_name}} validate --variant optimized'
      ```

      ## 3. Execute the variant and measure
      ```
      lrail {{workflow_name}} bash 'lrail wf {{workflow_name}} create --variant optimized'
      ```
      Run the created instance through all steps. Count the number of `next` rejections during the run.

      ## 4. Submit
      Submit: optimized_yaml (full YAML string), changes (array), validation_failure_count (measured number).

      NEVER modify the original workflow.yml — only save as variant.
    context_in:
      workflow_yaml: "{optimize-time.optimized_yaml}"
      original_yaml: "{snapshot-original.original_yaml}"
      original_path: "{snapshot-original.original_path}"
    required_output:
      - optimized_yaml
      - changes
      - validation_failure_count
    validation:
      - field: optimized_yaml
        op: type
        value: string
      - field: optimized_yaml
        op: not_empty
      - field: changes
        op: type
        value: array
      - field: validation_failure_count
        op: type
        value: number
    assertions:
      - field: validation_failure_count
        op: max
        value: "{baseline.validation_failure_count}"
        message: "Validation failures must not increase (baseline: {baseline.validation_failure_count})"
      - field: optimized_yaml
        op: script
        value: |
          node -e '
          const fs = require("fs");
          const ctx = process.env.CONTEXT ? JSON.parse(process.env.CONTEXT) : JSON.parse(fs.readFileSync(process.env.CONTEXT_FILE, "utf8"));
          const current = fs.readFileSync(ctx.original_path, "utf8");
          if (current !== ctx.original_yaml) {
            process.stderr.write("VIOLATION: original workflow.yml was modified — use variant files only");
            process.exit(1);
          }
          '
        message: "Original workflow.yml must NOT be modified — use variant files only"
    actions:
      - js: |
          const fs = require("fs");
          fs.writeFileSync(context.original_path, context.original_yaml);
    tips:
      - Common causes of rejection — missing required fields, wrong type, wrong field names
      - Adding JSON examples in tips dramatically reduces first-try failures
      - Don't remove validation rules that catch real errors — focus on making the agent succeed, not lowering the bar
      - "Save via CLI: lrail wf {{workflow_name}} save-variant optimized --yaml '<content>' — NEVER modify workflow.yml directly"

  # Step 6: Verify model tier (3 parallel)
  # The skill orchestrator spawns 3 agents, each running the optimized variant.
  - id: verify-model-tier
    description: Verify minimum passing model tier (3-tier parallel)
    depends_on: optimize-validation
    instruction: |
      Run the optimized workflow variant with 3 model tiers (Haiku, Sonnet, Opus) to determine the minimum passing model tier.

      For each model tier:
      1. Create an instance using the variant: `lrail wf {{workflow_name}} create --variant optimized`
      2. Run to completion (or note failure)
      3. Record: completed (bool), execution_time_sec, validation_failure_count

      Submit tier_results and the minimum passing tier.
    context_in:
      optimized_yaml: "{optimize-validation.optimized_yaml}"
    required_output:
      - tier_results
      - min_passing_tier
    validation:
      - field: tier_results
        op: type
        value: array
      - field: tier_results
        op: min_length
        value: 1
      - field: tier_results
        op: each_has
        value: model_tier
      - field: tier_results
        op: each_has
        value: completed
      - field: min_passing_tier
        op: type
        value: number
      - field: min_passing_tier
        op: one_of
        value: [1, 2, 3]
    assertions:
      - field: min_passing_tier
        op: max
        value: "{baseline.min_passing_tier}"
        message: "Min passing tier must not increase (baseline: {baseline.min_passing_tier})"
    tips:
      - "tier_results format: [{model_tier: 'haiku', completed: true, execution_time_sec: N, validation_failure_count: N}, ...]"
      - If a tier fails, set completed=false — still include it in tier_results
      - min_passing_tier: haiku=1, sonnet=2, opus=3
      - "Use variant: lrail wf {{workflow_name}} create --variant optimized"

  # Step 7: Synthesize (programmatic)
  - id: synthesize
    description: Produce final optimization report
    type: programmatic
    depends_on: verify-model-tier
    context_in:
      baseline_programmatic_ratio: "{baseline.programmatic_ratio}"
      baseline_execution_time: "{baseline.execution_time_sec}"
      baseline_validation_failures: "{baseline.validation_failure_count}"
      baseline_min_tier: "{baseline.min_passing_tier}"
      final_yaml: "{optimize-validation.optimized_yaml}"
      programmatic_changes: "{optimize-programmatic.changes}"
      time_changes: "{optimize-time.changes}"
      validation_changes: "{optimize-validation.changes}"
      tier_results: "{verify-model-tier.tier_results}"
      min_passing_tier: "{verify-model-tier.min_passing_tier}"
      new_programmatic_ratio: "{optimize-programmatic.new_programmatic_ratio}"
      new_execution_time: "{optimize-time.execution_time_sec}"
      new_validation_failures: "{optimize-validation.validation_failure_count}"
    actions:
      - js: |
          const report = {
            metrics_comparison: {
              programmatic_ratio: { baseline: context.baseline_programmatic_ratio, optimized: context.new_programmatic_ratio },
              execution_time_sec: { baseline: context.baseline_execution_time, optimized: context.new_execution_time },
              validation_failure_count: { baseline: context.baseline_validation_failures, optimized: context.new_validation_failures },
              min_passing_tier: { baseline: context.baseline_min_tier, optimized: context.min_passing_tier }
            },
            all_improved: (
              context.new_programmatic_ratio >= context.baseline_programmatic_ratio &&
              context.new_execution_time <= context.baseline_execution_time &&
              context.new_validation_failures <= context.baseline_validation_failures &&
              context.min_passing_tier <= context.baseline_min_tier
            ),
            total_changes: [
              ...(context.programmatic_changes || []).map(ch => ({...ch, direction: "programmatic"})),
              ...(context.time_changes || []).map(ch => ({...ch, direction: "time"})),
              ...(context.validation_changes || []).map(ch => ({...ch, direction: "validation"}))
            ]
          };
          return report;
    required_output:
      - metrics_comparison
      - all_improved
      - total_changes
