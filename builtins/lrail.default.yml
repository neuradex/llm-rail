# LLM Rail — Project Configuration
# lrail docs concepts/policy   — modes, rules, pattern syntax
# lrail docs concepts/secrets  — secret mediation

# Controls agent access to this config file (Read/Edit/Write).
# false (default): agents cannot see or modify this file.
# true: agents can read and modify this file.
# When visible is true, consider removing the 'lrail\.yml' deny rule below
# to also allow bash commands targeting this file.
visible: false

policy:
  mode: enforce       # trail | enforce
  default: allow      # allow (deny-list) | deny (allow-list)
  rules:
    - effect: deny
      commands:
        - "rm -rf *"
        - "sudo *"
        - "chmod 777 *"
        - "git push --force *"
        - "git push -f *"
        - "git reset --hard *"

        # Regex patterns — precise matching (catches flag reordering, absolute paths, etc.)
        - regex: "curl.*\\|\\s*(bash|sh)"    # pipe to shell
        - regex: ">(\\s*/dev/sd|\\s*/dev/disk)"  # write to raw device

        # Block bash commands targeting this config file.
        # Remove this rule if you set visible: true and want agents
        # to manage lrail.yml via shell commands as well.
        - regex: "lrail\\.yml"

