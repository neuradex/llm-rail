format: v1
name: data-pipeline
version: "1.0.0"
description: Fetch records, clean them with an agent, shape a report.

schemas:
  Input:
    type: object
    properties:
      source:
        type: string
        description: Source URL or path
      format:
        type: string
        enum: [json, csv]
        default: json
    required: [source]

  Output:
    type: object
    properties:
      report_text: { type: string, minLength: 20 }
      record_count: { type: integer, minimum: 0 }
      dropped_count: { type: integer, minimum: 0 }
    required: [report_text, record_count, dropped_count]

  Record:
    type: object
    properties:
      id: { type: string, minLength: 1 }
      data: { type: object }
    required: [id, data]

  FetchResult:
    type: object
    properties:
      raw_data:
        type: array
        items: Record
        minItems: 1
      schema: { type: object }
    required: [raw_data, schema]

  CleaningResult:
    type: object
    properties:
      transformed_data:
        type: array
        items: Record
      dropped_count: { type: integer, minimum: 0 }
      transform_log:
        type: array
        items: { type: string }
    required: [transformed_data, dropped_count, transform_log]

input: Input
output: Output

steps:
  - id: fetch
    type: agentic
    context_in:
      source: "{{source}}"
      format: "{{format}}"
    instruction: |
      Fetch records from {{source}} as {{format}}.
      Return each record with a stable `id` and a `data` object.
      Also return a `schema` object describing the field names and types.
    required_output: FetchResult

  - id: transform
    type: agentic
    context_in:
      records: "{fetch.raw_data}"
      schema: "{fetch.schema}"
    instruction: |
      Clean and validate each record against the schema. Drop records that
      cannot be repaired. Return the cleaned list, the count of dropped
      records, and a log of what was changed.
    required_output: CleaningResult
    assertions:
      - field: dropped_count
        op: lte
        value: 100
        message: Too many records dropped; review input quality.

  - id: report
    type: programmatic
    context_in:
      cleaned: "{transform.transformed_data}"
      dropped: "{transform.dropped_count}"
      log: "{transform.transform_log}"
    required_output: Output
    actions:
      - name: summarize
        description: Produce a short human-readable summary of the pipeline run
        js: |
          const lines = [
            `Pipeline processed ${context.cleaned.length + context.dropped} records.`,
            `Kept ${context.cleaned.length}, dropped ${context.dropped}.`,
            '',
            'Changes:',
            ...context.log.map(l => `  - ${l}`),
          ];
          return {
            report_text: lines.join('\n'),
            record_count: context.cleaned.length,
            dropped_count: context.dropped,
          };
