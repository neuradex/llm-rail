extends: base
variant: api-driven
description: "StockAnalysis API指定。Haiku可、rate limit 5req/min"
params:
  api_endpoint:
    type: string
    required: true
    description: StockAnalysis API endpoint URL
steps:
  - id: collect-companies
    type: programmatic
    actions:
      - js: |
          const endpoint = lrail.get("api_endpoint") || "https://api.example.com";
          return {
            companies: [
              { ticker: "6723.T", company_name: "Renesas Electronics", exchange: "TSE" },
              { ticker: "6857.T", company_name: "Advantest", exchange: "TSE" }
            ]
          };
  - id: collect-financials
    instruction: "Fetch financials from {{api_endpoint}} for each company"
    tips:
      - Use the provided API endpoint instead of web search
      - Rate limit is 5 requests per minute
