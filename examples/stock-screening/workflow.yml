format: v1
name: stock-screening
version: "1.0.0"
description: Sector-based stock screening with financials, news, and allocation.
phase: dev

schemas:
  Input:
    type: object
    properties:
      market:
        type: string
        default: Japan
        description: Target market.
      sector:
        type: string
        default: semiconductor
        description: Target sector.
      company_count:
        type: integer
        minimum: 5
        default: 20
        description: Number of companies to collect.

  Output:
    type: object
    properties:
      allocations:
        type: array
        items: Allocation
        minItems: 1
      total_weight: { type: number, minimum: 100, maximum: 100 }
      reasoning: { type: string, minLength: 50 }
      disclaimer: { type: string, minLength: 20 }
    required: [allocations, total_weight, reasoning, disclaimer]

  Company:
    type: object
    properties:
      ticker: { type: string, minLength: 1 }
      company_name: { type: string, minLength: 1 }
      exchange: { type: string }
    required: [ticker, company_name]

  Financial:
    type: object
    properties:
      ticker: { type: string }
      market_cap: { type: number, minimum: 0 }
      per: { type: number }
      pbr: { type: number }
      roe: { type: number }
      revenue_growth_pct: { type: number }
      source_url: { type: string, minLength: 1 }
      per_snippet: { type: string, minLength: 1 }
      roe_snippet: { type: string, minLength: 1 }
    required: [ticker, per, roe, source_url, per_snippet, roe_snippet]

  Analysis:
    type: object
    properties:
      ticker: { type: string }
      sentiment: { type: string, enum: [positive, neutral, negative] }
      risks: { type: array, items: { type: string } }
      highlights: { type: array, items: { type: string } }
    required: [ticker, sentiment, risks]

  ScoredCandidate:
    type: object
    properties:
      ticker: { type: string }
      score: { type: number, minimum: 0, maximum: 100 }
      bull_case: { type: string, minLength: 20 }
      bear_case: { type: string, minLength: 20 }
    required: [ticker, score, bull_case, bear_case]

  Allocation:
    type: object
    properties:
      ticker: { type: string }
      weight: { type: number, minimum: 0, maximum: 100 }
      rationale: { type: string, minLength: 10 }
    required: [ticker, weight, rationale]

  CompaniesResult:
    type: object
    properties:
      companies:
        type: array
        items: Company
        minItems: 20
    required: [companies]

  FinancialsResult:
    type: object
    properties:
      financials:
        type: array
        items: Financial
        minItems: 15
    required: [financials]

  ScreenedResult:
    type: object
    properties:
      candidates: { type: array, items: Financial }
      filtered_out: { type: array, items: Financial }
      nearest_miss: { type: array, items: Financial }
      candidates_count: { type: integer, minimum: 0 }
      criteria:
        type: object
        properties:
          per_max: { type: number }
          roe_min: { type: number }
        required: [per_max, roe_min]
    required: [candidates, filtered_out, nearest_miss, candidates_count, criteria]

  NewsResult:
    type: object
    properties:
      analyses:
        type: array
        items: Analysis
    required: [analyses]

  MatrixResult:
    type: object
    properties:
      matrix: { type: array, items: { type: object } }
      dimensions: { type: array, items: { type: string }, minItems: 3 }
    required: [matrix, dimensions]

  ScoringResult:
    type: object
    properties:
      scored_candidates: { type: array, items: ScoredCandidate, minItems: 1 }
    required: [scored_candidates]

input: Input
output: Output

policy:
  mode: trail

steps:
  - id: collect-companies
    type: agentic
    context_in:
      market: "{{market}}"
      sector: "{{sector}}"
      count: "{{company_count}}"
    instruction: |
      Search for {{count}} {{sector}}-related listed companies in the
      {{market}} market. For each: `company_name`, `ticker`, `exchange`.
      Include fabless, foundry, equipment, and materials companies.
      Use the correct ticker format for each exchange (e.g., 6723.T for Tokyo).
    required_output: CompaniesResult

  - id: collect-financials
    type: agentic
    context_in:
      companies: "{collect-companies.companies}"
    instruction: |
      For each company, collect `market_cap`, `per`, `pbr`, `roe`, and
      `revenue_growth_pct`. `per` is trailing twelve months. `roe` is a
      percentage number (15 means 15%). If a metric is unavailable, set
      it to null — NEVER fabricate.

      For every financial you MUST include:
        - `source_url` — the page where you found the numbers
        - `per_snippet` — verbatim page text containing the PER value
        - `roe_snippet` — verbatim page text containing the ROE value

      StockAnalysis.com (e.g., stockanalysis.com/quote/tyo/6723/) and
      Yahoo Finance are usable sources.
    required_output: FinancialsResult
    validation:
      - field: financials
        op: verify_source
        value:
          url_field: source_url
          field_snippets:
            per: per_snippet
            roe: roe_snippet
        message: Financial data source could not be verified — snippets must contain the claimed values and be found at the provided URL

  - id: screen-candidates
    type: programmatic
    context_in:
      financials: "{collect-financials.financials}"
    required_output: ScreenedResult
    actions:
      - name: apply-screen
        description: PER ≤ 15 AND ROE ≥ 10%; surface nearest-miss when no passes
        js: |
          const criteria = { per_max: 15, roe_min: 10 };
          const candidates = [];
          const filtered_out = [];
          for (const f of context.financials) {
            const per = typeof f.per === "string" ? parseFloat(f.per) : f.per;
            const roe = typeof f.roe === "string" ? parseFloat(f.roe) : f.roe;
            if (per != null && roe != null && per > 0 && per <= criteria.per_max && roe >= criteria.roe_min) {
              candidates.push({ ...f, per, roe });
            } else {
              const reasons = [];
              if (per == null || per < 0) reasons.push("PER is null or negative (loss-making)");
              else if (per > criteria.per_max) reasons.push(`PER ${per} > ${criteria.per_max}`);
              if (roe == null) reasons.push("ROE is null");
              else if (roe < criteria.roe_min) reasons.push(`ROE ${roe}% < ${criteria.roe_min}%`);
              filtered_out.push({ ...f, per, roe, reason: reasons.join(", ") });
            }
          }
          let nearest_miss = [];
          if (candidates.length === 0) {
            nearest_miss = filtered_out
              .filter(f => f.per != null && f.per > 0 && f.roe != null)
              .map(f => ({
                ...f,
                distance: Math.max(0, f.per - criteria.per_max) + Math.max(0, criteria.roe_min - f.roe),
              }))
              .sort((a, b) => a.distance - b.distance)
              .slice(0, 5);
          }
          return { candidates, filtered_out, nearest_miss, criteria, candidates_count: candidates.length };

  - id: news-analysis
    type: agentic
    context_in:
      candidates: "{screen-candidates.candidates}"
      nearest_miss: "{screen-candidates.nearest_miss}"
      candidates_count: "{screen-candidates.candidates_count}"
    instruction: |
      If `candidates_count` is 0, analyze the `nearest_miss` companies
      instead. For each, collect recent news and IR highlights (last
      3 months) and produce:
        - `sentiment`: positive | neutral | negative
        - `risks`: specific risk factors (e.g., "customer concentration
          — 60% revenue from single client"), not generic language
        - `highlights`: optional IR-level positives
    required_output: NewsResult

  - id: comparison-matrix
    type: agentic
    context_in:
      candidates: "{screen-candidates.candidates}"
      nearest_miss: "{screen-candidates.nearest_miss}"
      candidates_count: "{screen-candidates.candidates_count}"
      analyses: "{news-analysis.analyses}"
    instruction: |
      Build a competitive comparison matrix on at least 3 uniform
      dimensions mixing quantitative (PER, ROE, market_cap) and
      qualitative (sentiment, risk level) factors. If `candidates_count`
      is 0, use `nearest_miss`. Every company must appear with values
      for every dimension.
    required_output: MatrixResult

  - id: scoring
    type: agentic
    context_in:
      matrix: "{comparison-matrix.matrix}"
      analyses: "{news-analysis.analyses}"
    instruction: |
      Score each candidate (0–100, weighted combination of financials,
      sentiment, risks). Each entry needs `score`, `bull_case` (specific
      upside catalysts), and `bear_case` (specific downside risks).
      Avoid generic optimism / pessimism.
    required_output: ScoringResult

  - id: portfolio
    type: agentic
    context_in:
      scored_candidates: "{scoring.scored_candidates}"
      candidates_count: "{screen-candidates.candidates_count}"
    instruction: |
      Produce a portfolio allocation across scored candidates.

      Rules:
        - `total_weight` must equal 100 exactly (assertion enforces this).
        - Each `allocation` needs `ticker`, `weight` (0–100), and a
          specific `rationale` — not just "high score".
        - `reasoning` explains the overall portfolio strategy (min 50 chars).
        - `disclaimer` states this is not financial advice.
        - If `candidates_count` is 0, state clearly in `reasoning` that
          these are nearest-miss recommendations, not strict passes.
    required_output: Output
    assertions:
      - field: total_weight
        op: eq
        value: 100
        message: Allocation weights must sum to exactly 100
