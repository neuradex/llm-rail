visible: true

policy:
  mode: enforce
  default: allow
  rules:
    - effect: deny
      commands:
        # ── Destructive ops only (relaxed for dev repo) ──
        - "rm -rf *"                               # recursive force delete
        - regex: "rm\\s+(-\\w*r\\w*\\s+)*-\\w*f"   # rm -rf flag reordering
        - "sudo *"                                  # privilege escalation
        - "git push --force *"                      # force push
        - "git push -f *"
        - regex: "git\\s+push\\s+.*--force"
        - regex: "git\\s+reset\\s+--hard"           # hard reset
        - regex: "curl.*\\|\\s*(bash|sh|zsh)"       # pipe to shell
