name: generate
version: "0.1.0"
description: "Generate a working lrail workflow from user requirements. Iterates until the workflow passes validation and completes successfully."
phase: draft
params:
  requirements:
    type: string
    required: true
    description: "Natural language description of what the workflow should accomplish"
  output_name:
    type: string
    required: false
    default: "generated"
    description: "Name for the generated workflow"
policy:
  mode: trail
steps:
  # Step 1: Analyze requirements and design step breakdown
  - id: design
    description: Analyze requirements and design workflow steps
    instruction: |
      Analyze the user's requirements and design a workflow step breakdown.

      Requirements: {{requirements}}
      Output workflow name: {{output_name}}

      Read the lrail documentation to understand the framework:
      - `lrail docs workflow/design-tips` — design principles
      - `lrail docs concepts/step-types` — agentic vs programmatic
      - `lrail docs concepts/validation` — assertion operators

      Design the workflow:
      1. Break the task into discrete steps
      2. For each step, decide: agentic or programmatic?
      3. Identify dependencies between steps
      4. Define required_output fields for each step
      5. Plan validation rules to ensure quality

      Submit the step breakdown as a structured plan.
    required_output:
      - step_plan
      - total_steps
      - programmatic_count
      - agentic_count
    validation:
      - field: step_plan
        op: type
        value: array
      - field: step_plan
        op: not_empty
      - field: step_plan
        op: each_has
        value: id
      - field: step_plan
        op: each_has
        value: type
      - field: total_steps
        op: type
        value: number
      - field: total_steps
        op: min
        value: 1
    tips:
      - Prefer programmatic steps where possible (lower cost, deterministic)
      - Each step should have a single clear responsibility
      - Use context_in to pass data between steps explicitly
      - Validation rules prevent bad outputs from propagating to later steps

  # Step 2: Generate the workflow YAML
  - id: generate-yaml
    description: Generate workflow YAML from the design
    instruction: |
      Convert the step plan into a valid lrail workflow YAML.

      Requirements: {{requirements}}
      Workflow name: {{output_name}}
      Step plan is in context.

      The YAML must follow the lrail schema:
      - `name`, `version`, `description`, `phase: draft`
      - `params` if the workflow needs input parameters
      - `steps` with proper `id`, `instruction`, `required_output`, `validation`
      - `depends_on` for step ordering
      - `context_in` for explicit data flow
      - `tips` for agent guidance
      - Use `type: programmatic` with `actions: run` for deterministic steps

      After writing the YAML:
      1. Save it to `workflows/{{output_name}}.yml`
      2. Validate with `lrail wf {{output_name}} validate`
      3. Fix any validation errors

      Submit the final validated YAML.
    depends_on: design
    context_in:
      step_plan: "{design.step_plan}"
    required_output:
      - workflow_yaml
      - validation_passed
    validation:
      - field: workflow_yaml
        op: type
        value: string
      - field: workflow_yaml
        op: not_empty
      - field: validation_passed
        op: eq
        value: true
        message: "Workflow must pass lrail validation before proceeding"
    tips:
      - "Use `lrail docs concepts/validation` to check available assertion operators"
      - "Always include `instruction` for agentic steps (this is the agent directive)"
      - "description is optional human-readable summary"
      - "Test with `lrail wf <name> validate` — fix all errors before submitting"

  # Step 3: Test run the workflow
  - id: test-run
    description: Execute the generated workflow end-to-end
    instruction: |
      Run the generated workflow '{{output_name}}' end-to-end to verify it works.

      Steps:
      1. Create an instance: `lrail wf {{output_name}} create`
      2. Start it: `lrail <id> start`
      3. For each agentic step, perform the task and submit results with `lrail <id> next --result '<json>'`
      4. Programmatic steps will auto-execute

      If a step submission is rejected:
      - Note the rejection reason
      - Fix the submission and retry
      - Record the number of retries needed

      Submit the execution results including whether it completed successfully.
    depends_on: generate-yaml
    context_in:
      workflow_yaml: "{generate-yaml.workflow_yaml}"
    required_output:
      - completed
      - total_rejections
      - step_results
    validation:
      - field: completed
        op: type
        value: boolean
      - field: completed
        op: eq
        value: true
        message: "Workflow must complete successfully"
      - field: total_rejections
        op: type
        value: number
      - field: step_results
        op: type
        value: array
    tips:
      - If the workflow fails to complete, analyze why and note it — the next step can fix it
      - Record timing for each step if possible
      - Focus on making the workflow complete, not on producing perfect content
