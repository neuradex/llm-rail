name: sales-lead-finder
version: "0.1.0"
description: Find companies matching target criteria and collect their contact/inquiry form page URLs
phase: draft

params:
  target_criteria:
    type: string
    required: true
    description: Describes the kind of companies to find (e.g. 'Japanese B2B SaaS companies with 50-200 employees')
  min_companies:
    type: number
    required: false
    default: 10
    description: Minimum number of companies to collect

steps:
  - id: search-companies
    description: Search for companies matching target criteria
    instruction: |
      Search the web for companies matching this criteria: {{target_criteria}}

      For each company you find, collect:
      - name: the company name
      - website_url: the company's official website URL
      - description: a brief description of what the company does

      Return a JSON object with a "companies" array containing all found companies.
    required_output:
      - companies
    validation:
      - field: companies
        op: type
        value: array
      - field: companies
        op: min_length
        value: "{{min_companies}}"
        message: "Must collect at least {{min_companies}} companies"
      - field: companies
        op: each_has
        value: name
      - field: companies
        op: each_has
        value: website_url
    tips:
      - Use WebSearch to find companies matching the target criteria
      - Verify each company's website URL is valid and accessible
      - Include a variety of companies, not just the most well-known ones
      - Each company object must have name (string), website_url (string), and description (string)

  - id: find-contact-forms
    description: Find contact/inquiry form URLs for each company
    depends_on: search-companies
    instruction: |
      For each company in the provided list, visit their website and find the contact or inquiry form page URL.

      Try these approaches in order:
      1. Check common URL patterns: /contact, /contact-us, /inquiry, /お問い合わせ, /contacto
      2. Visit the company homepage and look for links containing keywords like "contact", "inquiry", "お問い合わせ", "get in touch", "reach us"
      3. Check the website footer or navigation menu for contact links

      For each company, provide:
      - company_name: the company name
      - website_url: the company's website URL
      - contact_form_url: the URL of the contact/inquiry form page (set to null if not found)
      - discovery_method: how the form was found (e.g. "direct URL pattern /contact", "link in footer", "navigation menu link", "not found")

      Also provide summary counts:
      - found_count: number of companies where a contact form was found
      - not_found_count: number of companies where no contact form was found
    context_in:
      companies: "{search-companies.companies}"
    required_output:
      - results
      - found_count
      - not_found_count
    validation:
      - field: results
        op: type
        value: array
      - field: results
        op: each_has
        value: company_name
      - field: results
        op: each_has
        value: website_url
      - field: results
        op: each_has
        value: contact_form_url
      - field: results
        op: each_has
        value: discovery_method
      - field: found_count
        op: type
        value: number
      - field: not_found_count
        op: type
        value: number
    assertions:
      - field: results
        op: script
        value: |
          node -e '
            const results = JSON.parse(process.env.FIELD_VALUE);
            const ctx = JSON.parse(process.env.CONTEXT);
            const total = ctx.found_count + ctx.not_found_count;
            if (total !== results.length) {
              console.error("found_count (" + ctx.found_count + ") + not_found_count (" + ctx.not_found_count + ") = " + total + " but results has " + results.length + " items");
              process.exit(1);
            }
          '
        message: "found_count + not_found_count must equal the number of results"
    tips:
      - Use WebFetch to visit each company's website and check for contact form URLs
      - Always try the direct URL pattern first (e.g. website_url + "/contact") before crawling
      - If the website is in Japanese, also try /お問い合わせ and look for Japanese contact-related text
      - Set contact_form_url to null (not an empty string) if no contact form is found
      - discovery_method should describe how you actually found the URL
