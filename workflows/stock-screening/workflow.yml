name: stock-screening
version: "0.1.0"
description: Stock screening and investment analysis report generator — collects companies, gathers financials with source verification, screens by PER/ROE criteria, analyzes news sentiment and competitive positioning, then scores and recommends a portfolio allocation
phase: draft

params:
  sector:
    type: string
    required: true
    description: Target sector (e.g., "semiconductor", "automotive", "pharma")
  market:
    type: string
    required: true
    description: Target market/country (e.g., "Japan", "US", "Korea")

steps:
  - id: collect-companies
    description: Collect listed companies in the target sector and market
    instruction: |
      Search the web for listed companies in the {{sector}} sector in the {{market}} market.

      Collect at least 20 companies spanning the full value chain (upstream suppliers, core players, downstream applications).

      For each company return: ticker, exchange, name, description (1-2 sentences about the company's business).
    required_output:
      - companies
    validation:
      - field: companies
        op: type
        value: array
      - field: companies
        op: min_length
        value: 20
        message: "Must collect at least 20 companies"
      - field: companies
        op: each_has
        value: ticker
      - field: companies
        op: each_has
        value: exchange
      - field: companies
        op: each_has
        value: name
      - field: companies
        op: each_has
        value: description
    tips:
      - Use WebSearch to find companies listed on exchanges in the target market
      - Include the full value chain — upstream materials/equipment, core manufacturers, downstream applications
      - Ticker format must match market convention (e.g., 4-digit numbers for Japan, letter symbols for US)
      - Include a mix of large-cap, mid-cap, and small-cap companies for diversity

  - id: gather-financials
    description: Look up financial metrics with source verification
    instruction: |
      For each company in the companies list, look up the following financial metrics:
      - market_cap (in local currency, as a number)
      - per (PER — trailing twelve months Price-to-Earnings ratio)
      - pbr (PBR — Price-to-Book ratio)
      - roe (ROE — Return on Equity as a percentage, e.g., 15.2 for 15.2%)
      - revenue_growth_pct (year-over-year revenue growth as a percentage)

      Return a financials array with one object per company containing: ticker, name, market_cap, per, pbr, roe, revenue_growth_pct.

      If a metric is unavailable, set it to null — never guess or fabricate values.
    context_in:
      companies: "{collect-companies.companies}"
    required_output:
      - financials
    validation:
      - field: financials
        op: type
        value: array
      - field: financials
        op: min_length
        value: 20
        message: "Must gather financials for at least 20 companies"
      - field: financials
        op: each_has
        value: ticker
      - field: financials
        op: each_has
        value: name
    tips:
      - Use WebSearch and WebFetch to find financial data from reliable sources (Yahoo Finance, Google Finance, stock exchange sites)
      - Use trailing twelve months PER, not forward PER
      - If a metric is unavailable, set it to null — never guess

  - id: screen-candidates
    description: Filter companies by PER <= 25 AND ROE >= 10%
    type: programmatic
    context_in:
      financials: "{gather-financials.financials}"
    actions:
      - js: |
          const screened = lrail.get("financials").filter(c =>
            c.per != null && c.roe != null && c.per <= 25 && c.roe >= 10
          );
          return { screened: screened, screened_count: screened.length };
    required_output:
      - screened
      - screened_count

  - id: news-sentiment
    description: Analyze recent news sentiment for screened candidates
    instruction: |
      For each company in the screened list, research recent news from the last 3 months.

      Assess overall sentiment as one of: positive, neutral, negative.

      For each company return: ticker, sentiment, key_news (array of 2-3 headline strings), rationale (1-2 sentences explaining the sentiment assessment).
    context_in:
      screened: "{screen-candidates.screened}"
    required_output:
      - news_analyses
    validation:
      - field: news_analyses
        op: type
        value: array
      - field: news_analyses
        op: each_has
        value: ticker
      - field: news_analyses
        op: each_has
        value: sentiment
      - field: news_analyses
        op: each_has
        value: key_news
      - field: news_analyses
        op: each_has
        value: rationale
    tips:
      - Use WebSearch to find recent news articles for each company
      - sentiment must be exactly one of: positive, neutral, negative
      - Focus on material news — earnings, product launches, regulatory actions, M&A, management changes
      - key_news should be actual headline strings, not summaries

  - id: competitive-matrix
    description: Compare screened candidates across 5 competitive dimensions
    instruction: |
      For each company in the screened list, evaluate and score on a 1-5 scale across these dimensions:
      - technology_strength: R&D capability, patents, technological moat
      - market_position: market share, brand recognition, customer base
      - financial_health: balance sheet strength, cash flow, debt levels
      - growth_potential: addressable market growth, expansion opportunities
      - valuation_attractiveness: current valuation relative to peers and growth

      Also include:
      - competitive_advantage: 1-2 sentences describing the company's key competitive edge
      - main_risk: 1-2 sentences describing the primary risk

      Use the financials data for quantitative context. Return a matrix array with one object per company.
    context_in:
      screened: "{screen-candidates.screened}"
      financials: "{gather-financials.financials}"
    required_output:
      - matrix
    validation:
      - field: matrix
        op: type
        value: array
      - field: matrix
        op: each_has
        value: ticker
      - field: matrix
        op: each_has
        value: technology_strength
      - field: matrix
        op: each_has
        value: market_position
      - field: matrix
        op: each_has
        value: financial_health
      - field: matrix
        op: each_has
        value: growth_potential
      - field: matrix
        op: each_has
        value: valuation_attractiveness
      - field: matrix
        op: each_has
        value: competitive_advantage
      - field: matrix
        op: each_has
        value: main_risk
    tips:
      - Scores must be integers from 1 to 5
      - Use financial data from gather-financials to inform financial_health and valuation_attractiveness scores
      - Be calibrated — not every company is a 5 in every dimension
      - competitive_advantage and main_risk should be specific, not generic

  - id: score-and-recommend
    description: Score candidates and recommend portfolio allocation
    instruction: |
      For each screened company, produce a final investment score (0-100) synthesizing financial metrics, news sentiment, and competitive positioning.

      For each company in scores, return: ticker, name, score (0-100), bull_case (2-3 sentences), bear_case (2-3 sentences).

      Then create a portfolio array with recommended allocation weights. Each entry: ticker, name, weight (percentage as a number). The weights across all portfolio entries must sum to exactly 100.

      Finally, provide a disclaimer string with a standard investment risk disclaimer (2-3 sentences).
    context_in:
      screened: "{screen-candidates.screened}"
      news_analyses: "{news-sentiment.news_analyses}"
      matrix: "{competitive-matrix.matrix}"
    required_output:
      - scores
      - portfolio
      - disclaimer
    validation:
      - field: scores
        op: type
        value: array
      - field: scores
        op: each_has
        value: ticker
      - field: scores
        op: each_has
        value: score
      - field: scores
        op: each_has
        value: bull_case
      - field: scores
        op: each_has
        value: bear_case
      - field: portfolio
        op: type
        value: array
      - field: portfolio
        op: each_has
        value: ticker
      - field: portfolio
        op: each_has
        value: weight
      - field: disclaimer
        op: type
        value: string
      - field: disclaimer
        op: not_empty
    assertions:
      - field: portfolio
        op: script
        value: |
          node -e '
          const fs = require("fs");
          const ctx = process.env.CONTEXT
            ? JSON.parse(process.env.CONTEXT)
            : JSON.parse(fs.readFileSync(process.env.CONTEXT_FILE, "utf8"));
          const total = ctx.portfolio.reduce((sum, p) => sum + p.weight, 0);
          if (Math.abs(total - 100) > 0.01) {
            console.error("Portfolio weights sum to " + total + ", expected exactly 100");
            process.exit(1);
          }
          '
        message: "Portfolio allocation weights must sum to exactly 100"
    tips:
      - Score should reflect a balanced view of all inputs — not just financials
      - Higher-conviction picks should get higher portfolio weights
      - Portfolio weights must sum to exactly 100 — verify before submitting
      - Bull and bear cases should be specific to each company, not generic
      - Disclaimer must mention that this is not financial advice and past performance does not guarantee future results

policy:
  mode: trail
