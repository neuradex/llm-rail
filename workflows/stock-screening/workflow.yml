name: stock-screening
version: "0.1.0"
description: Japanese semiconductor stock screening and investment analysis report
phase: draft

steps:
  - id: collect-companies
    instruction: >
      Search for and collect at least 20 listed semiconductor companies in Japan.
      For each company, provide the ticker symbol, stock exchange (e.g., TSE Prime, TSE Standard),
      and a brief description of their semiconductor business focus.
      Include major players like Tokyo Electron, Renesas, SCREEN Holdings, Advantest, etc.
      as well as mid-cap and smaller companies across the semiconductor value chain
      (equipment, materials, design, fabrication, testing).
    description: Collect 20+ Japanese semiconductor companies
    required_output:
      - companies
    validation:
      - field: companies
        op: type
        value: array
      - field: companies
        op: min_length
        value: 20
        message: "Must collect at least 20 companies"
      - field: companies
        op: each_has
        value: ticker
      - field: companies
        op: each_has
        value: exchange
      - field: companies
        op: each_has
        value: name
      - field: companies
        op: each_has
        value: description
    tips:
      - Use WebSearch to find comprehensive lists of Japanese semiconductor stocks
      - Include companies across the full semiconductor value chain — equipment, materials, design, fabrication, testing, packaging
      - Ticker format should include the numeric code (e.g., 8035 for Tokyo Electron)
      - Exchange should be one of TSE Prime, TSE Standard, TSE Growth, or other valid Japanese exchange

  - id: gather-financials
    instruction: >
      For each company in the provided list, look up the following financial metrics:
      market_cap (in billions of JPY), PER (trailing twelve months price-to-earnings ratio),
      PBR (price-to-book ratio), ROE (return on equity as percentage),
      and revenue_growth_pct (year-over-year revenue growth as percentage).
      Include the source_url where you found the data, and provide verbatim text snippets
      from the source page for each metric: per_snippet, roe_snippet.
      If a metric is genuinely unavailable, set it to null — never fabricate values.
    description: Gather financial metrics with source verification
    depends_on: collect-companies
    context_in:
      companies: "{collect-companies.companies}"
    required_output:
      - financials
    validation:
      - field: financials
        op: type
        value: array
      - field: financials
        op: min_length
        value: 20
        message: "Must have financials for at least 20 companies"
      - field: financials
        op: each_has
        value: ticker
      - field: financials
        op: each_has
        value: name
      - field: financials
        op: each_has
        value: source_url
      - field: financials
        op: verify_source
        value:
          url_field: source_url
          field_snippets:
            per: per_snippet
            roe: roe_snippet
        message: "Financial data could not be verified against source"
    tips:
      - Use WebSearch and WebFetch to find financial data from reliable sources like Yahoo Finance Japan, Kabutan, or company IR pages
      - Use PER trailing twelve months, not forward PER
      - If a metric is unavailable, set it to null — never guess or fabricate
      - per_snippet and roe_snippet must be verbatim text excerpts from the source page containing the actual values
      - market_cap should be in billions of JPY

  - id: screen-candidates
    type: programmatic
    description: Filter companies where PER <= 25 AND ROE >= 10%
    depends_on: gather-financials
    context_in:
      financials: "{gather-financials.financials}"
    required_output:
      - screened
      - screened_count
    actions:
      - js: |
          const financials = context.financials;
          const screened = financials.filter(c => c.per !== null && c.roe !== null && c.per <= 25 && c.roe >= 10);
          return { screened: screened, screened_count: screened.length };
    validation:
      - field: screened
        op: type
        value: array
      - field: screened_count
        op: type
        value: number

  - id: news-sentiment
    instruction: >
      For each screened candidate company, research recent news from the last 3 months.
      Summarize the key news items and assess overall sentiment as one of:
      positive, neutral, or negative. Provide a brief rationale for the sentiment assessment.
    description: Analyze recent news and sentiment for screened candidates
    depends_on: screen-candidates
    context_in:
      screened: "{screen-candidates.screened}"
    required_output:
      - news_analyses
    validation:
      - field: news_analyses
        op: type
        value: array
      - field: news_analyses
        op: each_has
        value: ticker
      - field: news_analyses
        op: each_has
        value: sentiment
      - field: news_analyses
        op: each_has
        value: key_news
      - field: news_analyses
        op: each_has
        value: rationale
    tips:
      - Use WebSearch to find recent news for each company
      - Focus on news from the last 3 months
      - Sentiment must be exactly one of: positive, neutral, negative
      - key_news should be an array of 2-5 headline summaries
      - Consider earnings announcements, product launches, partnerships, regulatory changes, and market trends

  - id: competitive-matrix
    instruction: >
      Build a competitive comparison matrix for the screened candidates.
      Compare them across these dimensions: technology_strength (1-5),
      market_position (1-5), financial_health (1-5), growth_potential (1-5),
      and valuation_attractiveness (1-5). Provide a brief justification for each rating.
      Also identify each company's primary competitive advantage and main risk factor.
    description: Build multi-dimensional competitive comparison matrix
    depends_on:
      - screen-candidates
      - gather-financials
    context_in:
      screened: "{screen-candidates.screened}"
      financials: "{gather-financials.financials}"
    required_output:
      - matrix
    validation:
      - field: matrix
        op: type
        value: array
      - field: matrix
        op: each_has
        value: ticker
      - field: matrix
        op: each_has
        value: technology_strength
      - field: matrix
        op: each_has
        value: market_position
      - field: matrix
        op: each_has
        value: financial_health
      - field: matrix
        op: each_has
        value: growth_potential
      - field: matrix
        op: each_has
        value: valuation_attractiveness
      - field: matrix
        op: each_has
        value: competitive_advantage
      - field: matrix
        op: each_has
        value: main_risk
    tips:
      - Use WebSearch to research each company's competitive position
      - Ratings must be integers from 1 to 5
      - Base financial_health on the actual financial metrics from the financials data
      - Base valuation_attractiveness on PER and PBR relative to peers
      - competitive_advantage should be a single sentence
      - main_risk should be a single sentence

  - id: score-and-recommend
    instruction: >
      Using all available data (screened financials, news sentiment, and competitive matrix),
      produce a final investment analysis:
      1. Score each screened candidate from 0 to 100 based on all factors.
      2. Write a bull case (2-3 sentences) and bear case (2-3 sentences) for each.
      3. Create a portfolio recommendation with allocation weights (percentage) for each candidate.
         The weights MUST sum to exactly 100.
      4. Include a comprehensive investment risk disclaimer.
    description: Score candidates, produce portfolio recommendation with risk disclaimer
    depends_on:
      - screen-candidates
      - news-sentiment
      - competitive-matrix
    context_in:
      screened: "{screen-candidates.screened}"
      news_analyses: "{news-sentiment.news_analyses}"
      matrix: "{competitive-matrix.matrix}"
    required_output:
      - scores
      - portfolio
      - disclaimer
    validation:
      - field: scores
        op: type
        value: array
      - field: scores
        op: each_has
        value: ticker
      - field: scores
        op: each_has
        value: score
      - field: scores
        op: each_has
        value: bull_case
      - field: scores
        op: each_has
        value: bear_case
      - field: portfolio
        op: type
        value: array
      - field: portfolio
        op: each_has
        value: ticker
      - field: portfolio
        op: each_has
        value: weight
      - field: disclaimer
        op: type
        value: string
      - field: disclaimer
        op: not_empty
    assertions:
      - field: portfolio
        op: script
        value: |
          const portfolio = context.FIELD_VALUE;
          const total = portfolio.reduce((sum, p) => sum + p.weight, 0);
          if (total !== 100) {
            throw new Error("Allocation weights sum to " + total + ", must be exactly 100");
          }
        message: "Portfolio allocation weights must sum to exactly 100"

policy:
  mode: trail
